<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <title>音频轨道提取器 - Audio Track Extractor</title>
    <style>
      /* 自定义 Slate 主题色 */
      :root {
        --p: 222 47% 11%;        /* primary: slate-900 */
        --pc: 210 40% 98%;       /* primary-content: slate-50 */
        --s: 215 16% 47%;        /* secondary: slate-600 */
        --sc: 214 32% 91%;       /* secondary-content: slate-100 */
        --a: 215 14% 58%;        /* accent: slate-500 */
        --ac: 210 40% 98%;       /* accent-content: slate-50 */
        --n: 215 25% 27%;        /* neutral: slate-700 */
        --nc: 214 32% 91%;       /* neutral-content: slate-100 */
        --b1: 210 40% 98%;       /* base-100: slate-50 */
        --b2: 214 32% 91%;       /* base-200: slate-100 */
        --b3: 210 40% 96%;       /* base-300: slate-200 */
        --bc: 222 47% 11%;       /* base-content: slate-900 */
        --in: 221 83% 53%;       /* info: blue-500 */
        --inc: 214 100% 97%;     /* info-content: blue-50 */
        --su: 158 64% 52%;       /* success: emerald-500 */
        --suc: 152 81% 96%;      /* success-content: emerald-50 */
        --wa: 32 95% 44%;        /* warning: amber-500 */
        --wac: 48 100% 96%;      /* warning-content: amber-50 */
        --er: 0 84% 60%;         /* error: red-500 */
        --erc: 0 86% 97%;        /* error-content: red-50 */
        --rounded-box: 1rem;
        --rounded-btn: 0.5rem;
        --rounded-badge: 0.5rem;
      }
    </style>
  </head>
